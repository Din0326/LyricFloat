[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricfloat"
version = "1.85"
description = "Floating desktop lyrics for any Windows media player (personal use)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "qasync>=0.27",
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "OpenCC>=1.1",
    "winrt-runtime>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",  # L3: process loopback capture
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "vcrpy>=6",
    "PyYAML>=6",
]
measure = [
    "openpyxl>=3.1",
    "psutil>=5.9",
]
build = [
    "pyinstaller>=6.6",
]
# L2 spike (tools/l2_spike): process loopback capture and speech recognition
l2 = [
    "comtypes>=1.4",
    "numpy>=2",
    "faster-whisper>=1.2",
    "psutil>=5.9",
]
# L3 spike (tools/l3_spike): vocal separation and forced alignment, on top of l2
l3 = [
    "torch>=2.4",
    "demucs>=4.1",  # its models on Hugging Face (SPEC v1.85)
    "stable-ts>=2.17",
]

[project.scripts]
lyricfloat = "lyricfloat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
